name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Tasleem-20
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Publish Snake to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/Tasleem-20/Tasleem-20.git repo

          cd repo

          git checkout --orphan output

          git rm -rf . || true

          cp ../dist/github-contribution-grid-snake.svg .

          git add github-contribution-grid-snake.svg

          git commit -m "Update contribution snake"

          git push origin output --force
